<style>
  html,body{margin:0;background:#05060a;color:#e7eaf0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.font-display{font-family:Orbitron,system-ui,sans-serif}
  ::selection{background:rgba(16,185,129,.35);color:#fff}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#05060a}::-webkit-scrollbar-thumb{background:#1d2230;border-radius:6px}
  .grid-bg{background-image:linear-gradient(rgba(16,185,129,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,.05) 1px,transparent 1px);background-size:42px 42px}
  .glow-ring{box-shadow:0 0 0 1px rgba(16,185,129,.45),0 0 26px rgba(16,185,129,.35)}
  .text-glow{text-shadow:0 0 18px rgba(52,211,153,.55)}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .floaty{animation:floaty 6s ease-in-out infinite}
  .viewport3d{position:relative;height:420px;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,#0a1322 0%,#04050a 70%);box-shadow:inset 0 0 70px rgba(0,0,0,.65)}
  .viewport3d canvas{display:block;width:100%!important;height:100%!important}
  .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px rgba(0,0,0,.85)}
  .blink{animation:blink 1s steps(1,end) infinite}@keyframes blink{50%{opacity:.2}}
  .toast{transform:translateY(14px);opacity:0;transition:all .5s cubic-bezier(.34,1.56,.64,1)}
  .toast.show{transform:translateY(0);opacity:1}
  @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1)}}
  .rise{animation:rise 1s ease-out forwards}
  .modal-back{animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-card{animation:modalIn .38s cubic-bezier(.34,1.56,.64,1)}@keyframes modalIn{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
  /* Cinematic hero image (Ken-Burns) */
  .hero-img{position:absolute;inset:0;background-size:cover;background-position:center;animation:kenburns 24s ease-in-out infinite;will-change:transform}
  @keyframes kenburns{0%{transform:scale(1.06) translate(0,0)}50%{transform:scale(1.18) translate(-1.5%,-1.2%)}100%{transform:scale(1.06) translate(0,0)}}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.45) 0%,rgba(5,6,10,.72) 55%,#05060a 100%)}
  .hero-sheen{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 10%,rgba(16,185,129,.18),transparent 60%);mix-blend-mode:screen;pointer-events:none}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important}}

  /* ── Theme system (light/dark toggle) ── */
  .app{--bg:#07060d;--panel:#121019;--panel2:#1a1726;--text:#f2efff;--muted:#9aa0b8;--border:rgba(255,255,255,.09);--accent:#8b5cf6;--accent-h:#7c3aed;--green:#10b981;background:var(--bg);color:var(--text);transition:background .35s,color .35s}
  .app.light{--bg:#f1eefb;--panel:#ffffff;--panel2:#f6f3ff;--text:#1b1533;--muted:#6b6880;--border:rgba(24,12,48,.10);--accent:#7c3aed;--accent-h:#6d28d9;--green:#059669}
  .panel{background:var(--panel);border:1px solid var(--border)}
  .panel2{background:var(--panel2);border:1px solid var(--border)}
  .t-muted{color:var(--muted)}
  .bd{border:1px solid var(--border)}
  .btn-accent{background:var(--accent);color:#fff;transition:.2s}.btn-accent:hover{background:var(--accent-h);transform:translateY(-1px)}
  .btn-soft{background:var(--panel2);color:var(--text);border:1px solid var(--border)}.btn-soft:hover{border-color:var(--accent)}
  .cat{color:var(--muted);transition:.18s;border:1px solid transparent}
  .cat:hover{color:var(--text);background:var(--panel2)}
  .cat.active{background:var(--accent);color:#fff}
  .accent{color:var(--accent)}
  .ring-accent{box-shadow:0 0 0 1px var(--accent),0 0 26px -6px var(--accent)}
  .pcard{background:var(--panel);border:1px solid var(--border);transition:transform .25s,box-shadow .25s,border-color .25s}
  .pcard:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 18px 50px -20px var(--accent)}
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const HERO_IMG='https://media.pixverse.ai/pixverse%2Ft2i%2Fori%2F00b68877-28d6-414c-aa99-b3de08caa345.jpg?x-oss-process=style/cover-webp';
const SHOWCASE_IMG='https://media.pixverse.ai/pixverse%2Ft2i%2Fori%2F0a931871-b916-4c87-b1eb-6653382ac2e7.jpg?x-oss-process=style/cover-webp';

function HeroBanner(){
  const wrap=useRef(null), par=useRef(null), txt=useRef(null);
  const onMove=(e)=>{ const r=wrap.current.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
    if(par.current) par.current.style.transform=`translate(${-px*2.4}%, ${-py*2.4}%)`;
    if(txt.current) txt.current.style.transform=`translate(${px*12}px, ${py*9}px)`; };
  const reset=()=>{ if(par.current) par.current.style.transform=''; if(txt.current) txt.current.style.transform=''; };
  return (
    <div ref={wrap} onMouseMove={onMove} onMouseLeave={reset} className="relative rounded-3xl overflow-hidden mb-8 border border-white/10 glow-ring">
      <div ref={par} className="absolute inset-0" style={{transition:'transform .25s ease-out'}}>
        <div className="hero-img" style={{backgroundImage:`url(${HERO_IMG})`}}/>
      </div>
      <div className="hero-overlay"/><div className="hero-sheen"/>
      <div ref={txt} className="relative px-6 sm:px-12 py-16 sm:py-24 max-w-2xl" style={{transition:'transform .35s ease-out'}}>
        <span className="inline-block text-xs tracking-[0.3em] uppercase text-neon-bright mb-4 px-3 py-1 rounded-full bg-ink/40 border border-neon/30">⚡ Instant · Secure · 24/7</span>
        <h1 className="text-4xl sm:text-6xl font-extrabold text-white leading-[1.05] drop-shadow-[0_4px_24px_rgba(0,0,0,.8)]">Everything you need,<br/><span className="text-neon-bright text-glow">all in one place.</span></h1>
        <p className="text-slate-200/90 mt-5 max-w-lg drop-shadow-[0_2px_10px_rgba(0,0,0,.85)]">Robux, V-Bucks, game currency, gift cards & more — delivered to your account in seconds. Fast delivery, secure payments, 24/7 support.</p>
        <div className="flex flex-wrap items-center gap-3 mt-8">
          <a href="#market" className="inline-flex items-center gap-2 px-7 py-3.5 rounded-xl font-semibold bg-neon text-ink hover:bg-neon-bright glow-ring hover:scale-[1.03] transition-all"><Icon.bolt width="18" height="18"/> View all products</a>
          <a href="#engine" className="inline-flex items-center gap-2 px-7 py-3.5 rounded-xl font-semibold bg-white/10 text-white border border-white/20 hover:border-neon/50 transition-all backdrop-blur">See live delivery</a>
        </div>
        <div className="flex items-center gap-3 mt-7">
          <div className="flex -space-x-2">{['🦊','🐼','🐯','🐲'].map((e,i)=>(<span key={i} className="w-8 h-8 rounded-full bg-ink/70 border border-white/20 flex items-center justify-center text-sm">{e}</span>))}</div>
          <div className="text-sm text-slate-200"><span className="text-amber-300">★★★★★</span> Trusted by <span className="font-semibold text-white">10,000+</span> gamers</div>
        </div>
      </div>
    </div>
  );
}

const Icon = {
  cart:(p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>),
  bolt:(p)=>(<svg viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>),
  check:(p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20 6 9 17l-5-5"/></svg>),
  menu:(p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}><path d="M3 12h18M3 6h18M3 18h18"/></svg>),
};

const easeOutBounce=(x)=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375;};
const easeInOut=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ── Three.js cinematic cyberpunk delivery scene ───────────── */
function initThree(mount){
  const THREE = window.THREE;
  if(!THREE){ mount.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#34d399;font-family:Orbitron">Loading 3D engine…</div>'; return {purchase(){},transit(){},arrive(){},reset(){},dispose(){}}; }

  let w=mount.clientWidth||720, h=mount.clientHeight||420;
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }
  catch(e){ mount.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#34d399">WebGL unavailable</div>'; return {purchase(){},transit(){},arrive(){},reset(){},dispose(){}}; }
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio));
  renderer.setSize(w,h); renderer.setClearColor(0x000000,0);
  if(THREE.sRGBEncoding!==undefined) renderer.outputEncoding=THREE.sRGBEncoding;
  if(THREE.ACESFilmicToneMapping!==undefined){ renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; }
  mount.appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x04060c, 0.018);

  const cam=new THREE.PerspectiveCamera(44, w/h, 0.1, 300);
  cam.position.set(17,14,17); cam.lookAt(0,1,0);

  let controls=null;
  if(THREE.OrbitControls){
    controls=new THREE.OrbitControls(cam, renderer.domElement);
    controls.enableDamping=true; controls.dampingFactor=0.08;
    controls.minPolarAngle=0.45; controls.maxPolarAngle=1.25;
    controls.minDistance=10; controls.maxDistance=46; controls.rotateSpeed=0.6;
    controls.target.set(0,1,0); controls.update();
  }

  // ── Lighting (dark base + intense neon point lights) ──
  scene.add(new THREE.AmbientLight(0x182238, 0.55));
  const key=new THREE.DirectionalLight(0x9fb4ff,0.5); key.position.set(10,18,6); scene.add(key);
  const neonLights=[
    [0x10b981,-8,6,-4],[0x22d3ee,9,7,5],[0xff3b5c,4,5,-9],[0x34d399,-6,5,7],[0x8b5cf6,12,6,-2],
  ].map(([c,x,y,z])=>{ const l=new THREE.PointLight(c,1.1,26); l.position.set(x,y,z); scene.add(l); return l; });
  const vaultLight=new THREE.PointLight(0x10b981,1.4,20); vaultLight.position.set(-9,4,0); scene.add(vaultLight);
  const houseLight=new THREE.PointLight(0x34d399,1.0,20); houseLight.position.set(9,4,0); scene.add(houseLight);

  const disp=[];
  const keep=(x)=>{disp.push(x);return x;};

  // ── Procedural textures ──
  function windowTex(rgb){
    const c=document.createElement('canvas'); c.width=64; c.height=128; const x=c.getContext('2d');
    x.fillStyle='#05070d'; x.fillRect(0,0,64,128);
    for(let r=0;r<14;r++) for(let col=0;col<6;col++){
      if(Math.random()<0.55){ x.fillStyle=`rgba(${rgb},${0.35+Math.random()*0.6})`; x.fillRect(6+col*9,6+r*8.6,5,5); }
    }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return keep(t);
  }
  const winTexes=[windowTex('52,211,153'),windowTex('34,211,238'),windowTex('255,90,120')];
  const winColors=[0x10b981,0x22d3ee,0xff3b5c];

  function starTex(){
    const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
    const g=x.createRadialGradient(32,32,0,32,32,30); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(110,231,183,.9)'); g.addColorStop(1,'rgba(16,185,129,0)');
    x.fillStyle=g; x.beginPath(); x.moveTo(32,3); x.lineTo(40,32); x.lineTo(32,61); x.lineTo(24,32); x.closePath(); x.fill();
    x.beginPath(); x.moveTo(3,32); x.lineTo(32,24); x.lineTo(61,32); x.lineTo(32,40); x.closePath(); x.fill();
    return keep(new THREE.CanvasTexture(c));
  }

  // ── Ground + neon grid ──
  const ground=new THREE.Mesh(keep(new THREE.PlaneGeometry(120,120)), new THREE.MeshStandardMaterial({color:0x05080f,roughness:.9,metalness:.3}));
  ground.rotation.x=-Math.PI/2; scene.add(ground);
  const grid=new THREE.GridHelper(120,120,0x10b981,0x0f2e26); grid.position.y=0.02; grid.material.transparent=true; grid.material.opacity=0.26; scene.add(grid);

  // ── City: diverse skyscrapers ──
  const edgeMat=(c)=>new THREE.LineBasicMaterial({color:c});
  const mkEdges=(geo,color,p)=>{ const e=new THREE.LineSegments(keep(new THREE.EdgesGeometry(geo)), edgeMat(color)); if(p) e.position.copy(p); return e; };
  const cityGroup=new THREE.Group(); scene.add(cityGroup);
  function tower(x,z,seed){
    const g=new THREE.Group(); g.position.set(x,0,z);
    const ci=Math.floor(Math.random()*3); const col=winColors[ci];
    const type=Math.random();
    const baseW=1.4+Math.random()*1.4, baseD=1.4+Math.random()*1.4;
    const totalH=2.2+Math.random()*5.5;
    if(type<0.25){ // hollow frame tower
      const geo=keep(new THREE.BoxGeometry(baseW,totalH,baseD));
      const frame=new THREE.LineSegments(keep(new THREE.EdgesGeometry(geo)), edgeMat(col)); frame.position.y=totalH/2; g.add(frame);
      // a few floor rings
      for(let fy=0.6; fy<totalH; fy+=0.8){ const ring=new THREE.LineSegments(keep(new THREE.EdgesGeometry(keep(new THREE.BoxGeometry(baseW,0.02,baseD)))), edgeMat(col)); ring.position.y=fy; g.add(ring); }
    } else if(type<0.55){ // tiered tower (stacked shrinking boxes)
      let y=0, tw=baseW, td=baseD, tiers=2+Math.floor(Math.random()*3);
      for(let ti=0;ti<tiers;ti++){ const th=totalH/tiers*(1-ti*0.12); const geo=keep(new THREE.BoxGeometry(tw,th,td));
        const tex=winTexes[ci].clone(); tex.repeat.set(Math.max(1,tw|0),Math.max(1,th|0)); keep(tex);
        const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0x0a0f17,roughness:.65,metalness:.35,emissive:col,emissiveIntensity:.5,emissiveMap:tex}));
        m.position.y=y+th/2; g.add(m);
        g.add(mkEdges(geo,col,m.position));
        y+=th; tw*=0.78; td*=0.78;
      }
    } else { // solid tower with window emissive map
      const geo=keep(new THREE.BoxGeometry(baseW,totalH,baseD));
      const tex=winTexes[ci].clone(); tex.repeat.set(Math.max(1,baseW|0),Math.max(2,totalH|0)); keep(tex);
      const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0x090e16,roughness:.6,metalness:.4,emissive:col,emissiveIntensity:.55,emissiveMap:tex}));
      m.position.y=totalH/2; g.add(m);
      const ed=new THREE.LineSegments(keep(new THREE.EdgesGeometry(geo)), edgeMat(col)); ed.position.copy(m.position); g.add(ed);
    }
    // random neon billboard panels on a side
    if(Math.random()<0.7){ const bc=winColors[Math.floor(Math.random()*3)];
      const bw=0.5+Math.random()*0.8, bh=0.5+Math.random()*1.2;
      const bb=new THREE.Mesh(keep(new THREE.PlaneGeometry(bw,bh)), new THREE.MeshBasicMaterial({color:bc,transparent:true,opacity:0.92,side:THREE.DoubleSide}));
      const side=Math.random()<.5?1:-1, axis=Math.random()<.5;
      const yy=0.8+Math.random()*(totalH-1);
      if(axis){ bb.position.set(side*(baseW/2+0.03), yy, (Math.random()-.5)*baseD*0.6); bb.rotation.y=Math.PI/2; }
      else { bb.position.set((Math.random()-.5)*baseW*0.6, yy, side*(baseD/2+0.03)); }
      bb.userData.flicker=Math.random()<.4; bb.userData.base=0.92; g.add(bb);
      if(bb.userData.flicker) billboards.push(bb);
    }
    cityGroup.add(g);
  }
  const billboards=[];
  // layout towers on a grid, leaving a clear corridor along the road (|z|<2 near center kept lower/empty)
  const slots=[];
  for(let gx=-18; gx<=18; gx+=3.2){ for(let gz=-14; gz<=14; gz+=3.2){
    if(Math.abs(gz)<2.4 && gx>-7 && gx<7) continue;            // keep delivery corridor clear
    if(gx>-8 && gx<8 && Math.abs(gz)<1.6) continue;
    if(Math.random()<0.62) slots.push([gx+(Math.random()-.5)*1.2, gz+(Math.random()-.5)*1.2]);
  }}
  slots.forEach(([x,z])=>tower(x,z));

  // ── Vault (left) ──
  const vault=new THREE.Group(); vault.position.set(-6,0,0);
  const vGeo=keep(new THREE.BoxGeometry(2.6,2.6,2.6));
  const vBox=new THREE.Mesh(vGeo, new THREE.MeshStandardMaterial({color:0x0c1320,emissive:0x10b981,emissiveIntensity:.3,metalness:.55,roughness:.3}));
  vBox.position.y=1.3; vault.add(vBox);
  vault.add(mkEdges(vGeo,0x34d399,vBox.position));
  const door=new THREE.Mesh(keep(new THREE.PlaneGeometry(1.1,1.5)), new THREE.MeshBasicMaterial({color:0x6ef7c0,transparent:true,opacity:.6})); door.position.set(0,1.05,1.31); vault.add(door);
  const pad=new THREE.Mesh(keep(new THREE.BoxGeometry(1.5,0.18,1.5)), new THREE.MeshStandardMaterial({color:0x0b1018,emissive:0x34d399,emissiveIntensity:.6})); pad.position.y=2.7; vault.add(pad);
  scene.add(vault);

  // ── House (right) ──
  const house=new THREE.Group(); house.position.set(6,0,0);
  const hMat=new THREE.MeshStandardMaterial({color:0x0d1626,emissive:0x10b981,emissiveIntensity:.3,metalness:.35,roughness:.45});
  const hGeo=keep(new THREE.BoxGeometry(2.5,2,2.5));
  const hBase=new THREE.Mesh(hGeo,hMat); hBase.position.y=1; house.add(hBase);
  house.add(mkEdges(hGeo,0x6ef7c0,hBase.position));
  const roofMat=new THREE.MeshStandardMaterial({color:0x0b1018,emissive:0x34d399,emissiveIntensity:.28});
  const roof=new THREE.Mesh(keep(new THREE.ConeGeometry(2.05,1.4,4)),roofMat); roof.position.y=2.7; roof.rotation.y=Math.PI/4; house.add(roof);
  const hwin=new THREE.Mesh(keep(new THREE.PlaneGeometry(0.8,1)), new THREE.MeshBasicMaterial({color:0x6ef7c0,transparent:true,opacity:.55})); hwin.position.set(0,1,1.26); house.add(hwin);
  // bloom-ish halo behind house
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:starTex(),color:0x34d399,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.set(10,10,1); halo.position.set(6,2,0); scene.add(halo);
  scene.add(house);

  // ── Road: flat wide curved highway + dashed glowing center line ──
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(-6,0.08,0), new THREE.Vector3(-3.5,0.08,2.4), new THREE.Vector3(-1,0.08,-1.4),
    new THREE.Vector3(1.6,0.08,2), new THREE.Vector3(3.9,0.08,-1.5), new THREE.Vector3(6,0.08,0),
  ]);
  const RN=200, halfW=0.95;
  const rp=curve.getSpacedPoints(RN), pos=[], idx=[], up=new THREE.Vector3(0,1,0), nrm=new THREE.Vector3(), tg=new THREE.Vector3();
  for(let i=0;i<=RN;i++){ const t=i/RN; curve.getTangentAt(t,tg); nrm.copy(tg).cross(up).normalize();
    pos.push(rp[i].x+nrm.x*halfW, 0.07, rp[i].z+nrm.z*halfW); pos.push(rp[i].x-nrm.x*halfW, 0.07, rp[i].z-nrm.z*halfW); }
  for(let i=0;i<RN;i++){ const a=i*2,b=a+1,c=a+2,d=a+3; idx.push(a,b,c, b,d,c); }

  const [theme,setTheme]=useState('dark');
  const [cart,setCart]=useState(0), [bumps,setBumps]=useState([]), [selected,setSelected]=useState(null), [activeCat,setActiveCat]=useState('All Products');
  const addToCart=()=>{ setCart(c=>c+1); const id=Date.now()+Math.random(); setBumps(b=>[...b,id]); setTimeout(()=>setBumps(b=>b.filter(x=>x!==id)),1000); };
  const shown=activeCat==='All Products'?ITEMS:ITEMS.filter(i=>i.cat===activeCat);
  return (
    <div className={`app ${theme} min-h-screen`}>
      <header className="sticky top-0 z-50 panel" style={{backdropFilter:'blur(14px)'}}>
        <nav className="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2.5"><div className="w-9 h-9 rounded-xl btn-accent flex items-center justify-center"><Icon.bolt width="18" height="18"/></div><span className="font-display font-extrabold tracking-wider" style={{color:'var(--text)'}}>FORGE<span className="accent">MARKET</span></span></div>
          <div className="hidden md:flex items-center gap-7 text-sm t-muted"><a className="hover:opacity-80" href="#market">Marketplace</a><a className="hover:opacity-80" href="#engine">Live Tracker</a><a className="hover:opacity-80" href="#reviews">Reviews</a><a className="hover:opacity-80" href="#discord">Support</a></div>
          <div className="flex items-center gap-2.5">
            <button onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="Toggle theme" className="w-10 h-10 rounded-xl btn-soft flex items-center justify-center">{theme==='dark'?'☀️':'🌙'}</button>
            <button className="relative w-10 h-10 rounded-xl btn-soft flex items-center justify-center"><Icon.cart width="18" height="18"/>{cart>0&&<span className="absolute -top-1.5 -right-1.5 min-w-[20px] h-5 px-1 rounded-full btn-accent text-xs font-bold flex items-center justify-center">{cart}</span>}{bumps.map(id=><span key={id} className="rise absolute -top-2 right-0 accent text-xs font-bold">+1</span>)}</button>
          </div>
        </nav>
      </header>

      <section className="max-w-6xl mx-auto px-5 pt-8 pb-6"><HeroBanner/></section>
      <section className="max-w-6xl mx-auto px-5 pb-8"><TrustBar/></section>

      {/* Sidebar + product grid */}
      <section id="market" className="max-w-6xl mx-auto px-5 py-6 grid lg:grid-cols-[220px_1fr] gap-6">
        <aside className="panel rounded-2xl p-3 h-max lg:sticky lg:top-20">
          <div className="text-[11px] uppercase tracking-wider t-muted px-3 py-2">Categories</div>
          <div className="flex lg:flex-col gap-1 overflow-x-auto">
            {CATS.map(c=>(<button key={c} onClick={()=>setActiveCat(c)} className={`cat text-left text-sm px-3 py-2 rounded-lg whitespace-nowrap font-medium ${activeCat===c?'active':''}`}>{c}</button>))}
          </div>
        </aside>
        <div>
          <div className="flex items-end justify-between mb-4"><div><h2 className="text-2xl font-bold" style={{color:'var(--text)'}}>Popular Products</h2><p className="text-sm t-muted mt-1">{shown.length} item{shown.length!==1?'s':''} · instant delivery</p></div></div>
          <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">{shown.map(it=><ProductCard key={it.name} item={it} onBuy={addToCart} onSelect={()=>setSelected(it)}/>)}</div>
        </div>
      </section>

      {/* 3D Live Delivery Engine (kept) */}
      <section id="engine" className="max-w-6xl mx-auto px-5 py-10">
        <div className="text-center mb-6"><h2 className="text-2xl sm:text-3xl font-bold" style={{color:'var(--text)'}}>See it in action</h2><p className="t-muted text-sm mt-1">Watch your order race across our live 3D delivery city.</p></div>
        <DeliveryJourney onDelivered={addToCart}/>
      </section>

      {/* Reviews */}
      <section id="reviews" className="max-w-6xl mx-auto px-5 py-10">
        <h2 className="text-2xl sm:text-3xl font-bold mb-6" style={{color:'var(--text)'}}>What our customers say</h2>
        <div className="grid md:grid-cols-3 gap-4">
          {REVIEWS.map(([n,st,tx])=>(<div key={n} className="panel rounded-2xl p-5"><div className="text-amber-400 mb-2">{st}</div><p style={{color:'var(--text)'}}>“{tx}”</p><div className="flex items-center gap-2.5 mt-4"><div className="w-8 h-8 rounded-full btn-accent flex items-center justify-center text-white text-sm font-semibold">{n[0]}</div><div className="text-sm font-medium" style={{color:'var(--text)'}}>{n}</div></div></div>))}
        </div>
      </section>

      {/* Discord band */}
      <section id="discord" className="max-w-6xl mx-auto px-5 py-10">
        <div className="rounded-3xl p-8 sm:p-12 text-center text-white relative overflow-hidden" style={{background:'linear-gradient(120deg,#5865F2,#7c3aed,#a855f7)'}}>
          <div className="absolute inset-0 grid-bg opacity-20"/>
          <div className="relative">
            <div className="text-4xl mb-2">💬</div>
            <h2 className="text-2xl sm:text-3xl font-extrabold">Join our Discord community</h2>
            <p className="text-white/85 mt-2 max-w-xl mx-auto">Drops, giveaways, instant support and verified vouches — all in one place.</p>
            <a href="https://discord.gg/vNcfgDbVd" target="_blank" className="inline-flex items-center gap-2 mt-6 px-7 py-3.5 rounded-xl font-semibold bg-white text-indigo-700 hover:scale-[1.03] transition-all">Join the server</a>
          </div>
        </div>
      </section>

      <footer className="py-8 text-center text-sm t-muted bd" style={{borderTop:'1px solid var(--border)'}}>FORGEMARKET — premium in-game assets · automated delivery · 24/7 support</footer>
      <ProductModal item={selected} onClose={()=>setSelected(null)} onBuy={addToCart}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
