<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.55" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <ellipse cx="256" cy="120" rx="240" ry="150" fill="url(#glow)"/>
  <!-- lightning bolt (upper) -->
  <g transform="translate(128,8) scale(0.5)" filter="url(#soft)">
    <path d="M300 70 L150 290 H236 L208 442 L372 210 H280 L300 70 Z" fill="#ffffff"/>
  </g>
  <!-- wordmark -->
  <text x="256" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="78" font-weight="900" fill="#ffffff" letter-spacing="2">FORGE</text>
  <text x="256" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="78" font-weight="900" fill="#ffe27a" letter-spacing="2">MARKET</text>
</svg>
