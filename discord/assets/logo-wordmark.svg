<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b54f0"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7e2ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset="0.5" stop-color="#ffd95e"/><stop offset="1" stop-color="#f5b324"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="boltShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#3b1d6e" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.55"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2a1450" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#sheen)"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
  </g>
  <ellipse cx="256" cy="118" rx="250" ry="160" fill="url(#glow)"/>
  <!-- inner border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- lightning bolt (upper) -->
  <g transform="translate(132,18) scale(0.52)" filter="url(#boltShadow)">
    <path d="M300 60 L150 296 H238 L206 452 L378 206 H284 L300 60 Z" fill="url(#bolt)"
          stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g filter="url(#textShadow)">
    <text x="256" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="80" font-weight="900" fill="#ffffff" letter-spacing="3">FORGE</text>
    <text x="256" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="80" font-weight="900" fill="url(#gold)" letter-spacing="3">MARKET</text>
  </g>
</svg>
